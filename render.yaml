# Render Blueprint: https://render.com/docs/blueprint-spec
# Connect repo → New Blueprint → paste this file or auto-detect.
services:
  - type: web
    name: finsight-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: AI_PROVIDER
        value: mock
      - key: MOCK_CLAUDE
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
        optional: true